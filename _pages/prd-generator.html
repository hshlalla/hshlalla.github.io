<div class="glass-panel" style="margin: 2rem auto; max-width: 800px;">
  <div class="panel-title">
    <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"></path><polyline points="14 2 14 8 20 8"></polyline><line x1="16" y1="13" x2="8" y2="13"></line><line x1="16" y1="17" x2="8" y2="17"></line><polyline points="10 9 9 9 8 9"></polyline></svg>
    Transcript to PRD Generator
  </div>
  
  <p style="color: var(--text-dim); margin-bottom: 2rem;">스마트폰으로 녹음한 <strong>회의록 텍스트(.txt)</strong>나 <strong>마크다운(.md)</strong> 파일을 업로드하면, AI가 구조화된 PRD(Product Requirements Document)로 변환해 줍니다.</p>

  <!-- Upload Section -->
  <div id="upload-section" style="border: 2px dashed var(--accent-secondary); border-radius: 15px; padding: 3rem; text-align: center; margin-bottom: 2rem; transition: 0.3s; background: rgba(0, 242, 255, 0.05);">
    <input type="file" id="md-file-input" accept=".md, .txt" style="display: none;">
    <label for="md-file-input" style="cursor: pointer; display: inline-block;">
      <svg width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="var(--accent-secondary)" stroke-width="2" style="margin-bottom: 1rem;"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path><polyline points="17 8 12 3 7 8"></polyline><line x1="12" y1="3" x2="12" y2="15"></line></svg>
      <br>
      <span style="font-weight: 700; color: var(--accent-secondary); font-size: 1.2rem;">Click to upload .txt or .md</span>
    </label>
    <div id="file-name-display" style="margin-top: 1rem; color: var(--text-main); font-weight: 600;"></div>
  </div>

  <button id="generate-btn" style="width: 100%; padding: 1rem; border: none; border-radius: 10px; background: linear-gradient(90deg, var(--accent-primary), var(--accent-secondary)); color: white; font-weight: 700; font-size: 1.1rem; cursor: pointer; opacity: 0.5; pointer-events: none; transition: 0.3s;">
    Generate PRD
  </button>

  <!-- Result Section -->
  <div id="result-section" style="margin-top: 3rem; display: none;">
    <h3 style="color: var(--accent-primary); border-bottom: 1px solid var(--glass-border); padding-bottom: 0.5rem;">Generated PRD Preview</h3>
    <div id="prd-content" style="background: rgba(255,255,255,0.05); padding: 2rem; border-radius: 10px; border: 1px solid var(--glass-border); color: var(--text-main); line-height: 1.6; max-height: 600px; overflow-y: auto;">
      <!-- Content injected by JS -->
    </div>
  </div>
</div>

<script>
  const fileInput = document.getElementById('md-file-input');
  const fileNameDisplay = document.getElementById('file-name-display');
  const generateBtn = document.getElementById('generate-btn');
  const resultSection = document.getElementById('result-section');
  const prdContent = document.getElementById('prd-content');

  let uploadedText = '';

  fileInput.addEventListener('change', function(e) {
    const file = e.target.files[0];
    if (file) {
      if (!file.name.endsWith('.md') && !file.name.endsWith('.txt')) {
        alert('Please upload a .md or .txt file.');
        return;
      }
      fileNameDisplay.textContent = `Selected: ${file.name}`;
      
      const reader = new FileReader();
      reader.onload = function(e) {
        uploadedText = e.target.result;
        // Enable button
        generateBtn.style.opacity = '1';
        generateBtn.style.pointerEvents = 'auto';
      };
      reader.readAsText(file);
    }
  });

  generateBtn.addEventListener('click', function() {
    // Show loading state
    generateBtn.textContent = 'Generating via AI...';
    generateBtn.style.opacity = '0.7';
    
    // Simulate AI API Call Delay
    setTimeout(() => {
      // In a real scenario, you would do:
      // fetch('https://api.openai.com/v1/chat/completions', { ... })
      
      // For now, we simulate a PRD generation based on the text
      const simulatedPRD = `
# 📝 Product Requirements Document (Generated)

## 1. Overview
This is a simulated PRD based on the uploaded content.
**Original Input Length:** ${uploadedText.length} characters.

## 2. Goals & Objectives
* To automatically parse markdown files.
* To provide a structured format for development.

## 3. Key Features Extracted (Mock)
* User authentication
* Interactive dashboard
* API Integration

## 4. Source Content Preview
> ${uploadedText.substring(0, 200)}...

---
*Note: To actually generate dynamic content, connect this script to an AI API (e.g., OpenAI or OpenClaw) using a serverless function.*
      `;

      // Simple Markdown to HTML formatting for the preview
      prdContent.innerHTML = simulatedPRD
        .replace(/^# (.*$)/gim, '<h1 style="color:var(--accent-secondary); margin-top:2rem;">$1</h1>')
        .replace(/^## (.*$)/gim, '<h2 style="color:var(--text-main); margin-top:1.5rem;">$1</h2>')
        .replace(/^> (.*$)/gim, '<blockquote style="border-left: 4px solid var(--accent-primary); padding-left: 1rem; color: var(--text-dim); background: rgba(255,255,255,0.02); padding: 0.5rem;">$1</blockquote>')
        .replace(/\n\n/g, '<br><br>');

      resultSection.style.display = 'block';
      generateBtn.textContent = 'Generate PRD';
      generateBtn.style.opacity = '1';
    }, 1500);
  });
</script>
