<!-- AI Agent Chat Widget -->
<div id="agent-chat-wrapper">
  <!-- Trigger Button -->
  <div id="agent-chat-trigger" onclick="toggleChat()">
    <svg width="30" height="30" viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"></path>
    </svg>
  </div>

  <!-- Chat Window -->
  <div id="agent-chat-window" class="glass-panel" style="display: none; position: fixed; bottom: 6rem; right: 2rem; width: 350px; height: 500px; z-index: 1001; flex-direction: column; padding: 0;">
    <div style="padding: 1rem; border-bottom: 1px solid var(--glass-border); display: flex; justify-content: space-between; align-items: center;">
      <div style="display: flex; align-items: center; gap: 0.5rem;">
        <div class="alive-dot"></div>
        <span style="font-weight: 700; color: var(--accent-secondary);">DeepSound Agent</span>
      </div>
      <button onclick="toggleChat()" style="background: none; border: none; color: white; cursor: pointer; font-size: 1.2rem;">&times;</button>
    </div>
    
    <div id="chat-messages" style="flex: 1; overflow-y: auto; padding: 1rem; display: flex; flex-direction: column; gap: 0.75rem;">
      <div class="message system" style="background: rgba(255,255,255,0.05); padding: 0.75rem; border-radius: 10px; font-size: 0.9rem;">
        안녕하세요! Sound of DeepLearning의 업무 담당 에이전트입니다. 궁금하신 점이 있으시면 편하게 물어봐 주세요.
      </div>
    </div>

    <div style="padding: 1rem; border-top: 1px solid var(--glass-border); display: flex; gap: 0.5rem;">
      <input type="text" id="chat-input" placeholder="Type a message..." style="flex: 1; background: rgba(0,0,0,0.3); border: 1px solid var(--glass-border); border-radius: 10px; padding: 0.5rem; color: white; outline: none;">
      <button onclick="sendMessage()" style="background: var(--accent-primary); border: none; border-radius: 10px; padding: 0.5rem 1rem; color: white; cursor: pointer;">Send</button>
    </div>
  </div>
</div>

<script>
function toggleChat() {
  const window = document.getElementById('agent-chat-window');
  if (window.style.display === 'none') {
    window.style.display = 'flex';
    window.style.animation = 'fadeInUp 0.3s ease-out';
  } else {
    window.style.display = 'none';
  }
}

function sendMessage() {
  const input = document.getElementById('chat-input');
  const container = document.getElementById('chat-messages');
  if (!input.value.trim()) return;

  const userMsg = document.createElement('div');
  userMsg.style.alignSelf = 'flex-end';
  userMsg.style.background = 'var(--accent-primary)';
  userMsg.style.padding = '0.75rem';
  userMsg.style.borderRadius = '10px 10px 0 10px';
  userMsg.style.fontSize = '0.9rem';
  userMsg.style.maxWidth = '80%';
  userMsg.textContent = input.value;
  container.appendChild(userMsg);

  const val = input.value;
  input.value = '';
  container.scrollTop = container.scrollHeight;

  // Placeholder for AI Response
  setTimeout(() => {
    const aiMsg = document.createElement('div');
    aiMsg.style.alignSelf = 'flex-start';
    aiMsg.style.background = 'rgba(255,255,255,0.1)';
    aiMsg.style.padding = '0.75rem';
    aiMsg.style.borderRadius = '10px 10px 10px 0';
    aiMsg.style.fontSize = '0.9rem';
    aiMsg.style.maxWidth = '80%';
    aiMsg.textContent = "에이전트가 처리 중입니다... (API 설정이 필요합니다)";
    container.appendChild(aiMsg);
    container.scrollTop = container.scrollHeight;
  }, 1000);
}
</script>

<style>
@keyframes fadeInUp {
  from { opacity: 0; transform: translateY(20px); }
  to { opacity: 1; transform: translateY(0); }
}
</style>
